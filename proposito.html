  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Nuestro propósito | Lidl España<\u002Ftitle>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<script src=\"11028f1d-e815-429e-9c31-041f48667d6b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  @font-face { font-family: \"Lidl Font Pro\"; src: url(\"6eb88998-5857-4a35-ae30-abf472e1d194\") format(\"truetype\"); font-weight: 300 400; font-style: normal; font-display: swap; }\n  @font-face { font-family: \"Lidl Font Pro\"; src: url(\"91ad16fc-50c8-4ecd-b895-d0995859814d\") format(\"truetype\"); font-weight: 500 600; font-style: normal; font-display: swap; }\n  @font-face { font-family: \"Lidl Font Pro\"; src: url(\"8e574d3f-4602-4acc-9008-eea822b697d4\") format(\"truetype\"); font-weight: 700 900; font-style: normal; font-display: swap; }\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #ffffff; font-family: \"Lidl Font Pro\", \"Segoe UI\", sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #0050AA; text-decoration: none; }\n  a:hover { color: #002466; }\n  .noscroll::-webkit-scrollbar { height: 0; width: 0; }\n  @keyframes lidlFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n  section[id] { scroll-margin-top: 138px; }\n  @media (min-width: 1001px) { section[id] { scroll-margin-top: 64px; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"font-family: 'Lidl Font Pro', sans-serif; color: #0050AA; overflow-x: clip\">\n\n  <header style=\"position: relative; z-index: 60\">\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"height: 74px\"><\u002Fdiv>\n      <div style=\"background: #fff; position: fixed; top: 0; left: 0; right: 0; z-index: 70; border-bottom: 1px solid #E3E8EF; box-shadow: 0 2px 14px rgba(0,25,70,.10)\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 16px\">\n          <a href=\"index.html\" style=\"display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; flex: none; border-radius: 6px\">\n            <img src=\"57138a1b-47a7-4556-8bc4-0743e1dbd43e\" alt=\"Lidl\" style=\"width: 100%; height: 100%; display: block\">\n          <\u002Fa>\n          <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Abrir menú\" style=\"width: 48px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: none; border: 0; padding: 0; cursor: pointer\">\n            <span style=\"display: block; width: 26px; height: 3px; border-radius: 2px; background: #0050AA; transition: transform .25s ease, opacity .25s ease; transform: {{ burgerTop }}\"><\u002Fspan>\n            <span style=\"display: block; width: 26px; height: 3px; border-radius: 2px; background: #0050AA; transition: opacity .2s ease; opacity: {{ burgerMid }}\"><\u002Fspan>\n            <span style=\"display: block; width: 26px; height: 3px; border-radius: 2px; background: #0050AA; transition: transform .25s ease; transform: {{ burgerBot }}\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <nav style=\"border-top: 1px solid #E3E8EF; padding: 8px 16px 18px; animation: lidlFade .22s ease both; max-height: calc(100vh - 74px); overflow-y: auto\">\n            <a href=\"#top\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: center; min-height: 52px; color: #0050AA; font-size: 18px; font-weight: 800; border-bottom: 1px solid #E7ECF2\">Nuestro propósito<\u002Fa>\n            <a href=\"index.html#compromiso\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: center; min-height: 52px; color: #33507A; font-size: 18px; font-weight: 600; border-bottom: 1px solid #E7ECF2\" style-hover=\"color: #0050AA\">Nuestro compromiso<\u002Fa>\n            <sc-for list=\"{{ mobileGroups }}\" as=\"mg\" hint-placeholder-count=\"2\">\n              <div style=\"border-bottom: 1px solid #E7ECF2\">\n                <button sc-camel-on-click=\"{{ mg.toggle }}\" style=\"width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0; background: none; border: 0; cursor: pointer; color: #33507A; font-family: 'Lidl Font Pro', sans-serif; font-size: 18px; font-weight: 600; text-align: left\">\n                  <span style=\"flex: 1\">{{ mg.title }}<\u002Fspan>\n                  <span style=\"flex: none; display: flex; transition: transform .25s ease; transform: {{ mg.chevron }}\">\n                    <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ mg.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding: 2px 0 12px; animation: lidlFade .2s ease both\">\n                    <sc-for list=\"{{ mg.items }}\" as=\"it\" hint-placeholder-count=\"0\">\n                      <a href=\"{{ it.href }}\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: center; gap: 10px; min-height: 46px; padding-left: 14px; color: #6E7C8C; font-size: 16px; font-weight: 500\" style-hover=\"color: #0050AA\">\n                        <span style=\"flex: none; display: flex; opacity: .8\">{{ it.icon }}<\u002Fspan>\n                        {{ it.label }}\n                      <\u002Fa>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display: flex; gap: 10px; margin-top: 16px\">\n              <a href=\"#\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; background: #0050AA; color: #fff; font-size: 15px; font-weight: 800; border-radius: 999px\" style-hover=\"background: #002466; color: #fff\">Empleo<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 2px solid #C7D3E2; color: #0050AA; font-size: 15px; font-weight: 700; border-radius: 999px\" style-hover=\"border: 2px solid #0050AA; color: #0050AA\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3.2 9.5h17.6M3.2 14.5h17.6M12 3c2.6 3.2 2.6 14.8 0 18M12 3c-2.6 3.2-2.6 14.8 0 18\"><\u002Fpath><\u002Fsvg>\n                Idioma\n              <\u002Fa>\n            <\u002Fdiv>\n          <\u002Fnav>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background: #FFF000\">\n        <div style=\"max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); height: 46px; display: flex; align-items: center; justify-content: flex-end; gap: 34px\">\n          <a href=\"#\" style=\"color: #0050AA; font-size: 17px; font-weight: 400; display: flex; align-items: center; gap: 9px\" style-hover=\"color: #002466; text-decoration: underline\">Empleo<\u002Fa>\n          <a href=\"#\" style=\"color: #0050AA; font-size: 17px; font-weight: 400; display: flex; align-items: center; gap: 9px\" style-hover=\"color: #002466; text-decoration: underline\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3.2 9.5h17.6M3.2 14.5h17.6M12 3c2.6 3.2 2.6 14.8 0 18M12 3c-2.6 3.2-2.6 14.8 0 18\"><\u002Fpath><\u002Fsvg>\n            Cambiar idioma\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-bottom: 1px solid #E3E8EF\">\n        <div style=\"position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); height: clamp(88px, 8vw, 104px); display: flex; align-items: center; gap: clamp(12px, 2vw, 28px)\">\n          <a href=\"index.html\" style=\"display: flex; align-items: center; justify-content: center; width: clamp(80px, 7.4vw, 104px); height: clamp(80px, 7.4vw, 104px); flex: none; position: absolute; top: clamp(-32px, -2.6vw, -22px); left: clamp(16px, 3vw, 32px); z-index: 2; background: #fff; padding: 3px\">\n            <img src=\"57138a1b-47a7-4556-8bc4-0743e1dbd43e\" alt=\"Lidl\" style=\"width: 100%; height: 100%; display: block\">\n          <\u002Fa>\n          <nav sc-camel-on-mouse-leave=\"{{ closeDrop }}\" style=\"display: flex; align-items: center; gap: clamp(2px, 0.6vw, 10px); margin-left: clamp(104px, 11vw, 200px); flex-wrap: nowrap\">\n            <a href=\"#top\" sc-camel-on-mouse-enter=\"{{ closeDrop }}\" style=\"padding: 9px clamp(9px, 1.1vw, 17px); border-radius: 6px; color: #fff; font-size: clamp(15.5px, 1.5vw, 21px); font-weight: 400; white-space: nowrap; background: #0050AA; transition: background .2s ease\" style-hover=\"background: #002466; color: #fff\">Nuestro propósito<\u002Fa>\n            <a href=\"index.html#compromiso\" sc-camel-on-mouse-enter=\"{{ closeDrop }}\" style=\"padding: 9px clamp(9px, 1.1vw, 17px); border-radius: 6px; color: #6E7C8C; font-size: clamp(15.5px, 1.5vw, 21px); font-weight: 400; white-space: nowrap; background: transparent; transition: background .2s ease\" style-hover=\"background: #EDF2F8; color: #0050AA\">Nuestro compromiso<\u002Fa>\n            <a href=\"#\" sc-camel-on-mouse-enter=\"{{ openResp }}\" style=\"padding: 9px clamp(9px, 1.1vw, 17px); border-radius: 6px; color: #6E7C8C; font-size: clamp(15.5px, 1.5vw, 21px); font-weight: 400; white-space: nowrap; background: {{ respBg }}; transition: background .2s ease\" style-hover=\"background: #EDF2F8; color: #0050AA\">Nuestra responsabilidad<\u002Fa>\n            <a href=\"#\" sc-camel-on-mouse-enter=\"{{ openPress }}\" style=\"padding: 9px clamp(9px, 1.1vw, 17px); border-radius: 6px; color: #6E7C8C; font-size: clamp(15.5px, 1.5vw, 21px); font-weight: 400; white-space: nowrap; background: {{ pressBg }}; transition: background .2s ease\" style-hover=\"background: #EDF2F8; color: #0050AA\">Sala de prensa<\u002Fa>\n          <\u002Fnav>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ dropOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-mouse-leave=\"{{ closeDrop }}\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 65; background: #F5F7FA; border-bottom: 1px solid #E3E8EF; box-shadow: 0 16px 34px rgba(0,30,80,.18); animation: lidlFade .18s ease both\">\n          <div style=\"max-width: 1440px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) 30px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, auto); column-gap: clamp(28px, 5vw, 64px)\">\n            <sc-for list=\"{{ dropItems }}\" as=\"it\" hint-placeholder-count=\"0\">\n              <a href=\"{{ it.href }}\" sc-camel-on-click=\"{{ closeDrop }}\" style=\"display: flex; align-items: center; gap: 11px; min-height: 58px; padding: 0 4px; font-size: 17px; font-weight: 500; color: #6E7C8C; border-bottom: 1px solid #DFE5EC\" style-hover=\"color: #0050AA\">\n                <span style=\"flex: none; display: flex; color: #8A97A5\">{{ it.icon }}<\u002Fspan>\n                {{ it.label }}\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <nav aria-label=\"Ruta de navegación\" style=\"background: #fff; border-bottom: 1px solid #EDF1F6\">\n    <div class=\"noscroll\" style=\"max-width: 1440px; margin: 0 auto; padding: 12px clamp(16px, 3vw, 32px); display: flex; align-items: center; gap: 9px; font-size: 14px; overflow-x: auto; white-space: nowrap\">\n      <a href=\"index.html\" style=\"color: #6E7C8C; font-weight: 500\" style-hover=\"color: #0050AA\">Inicio<\u002Fa>\n      <span style=\"color: #B7C2CF\">/<\u002Fspan>\n      <span style=\"color: #0050AA; font-weight: 700\">Nuestro propósito<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <section id=\"top\" style=\"position: relative\">\n    <div style=\"width: 100%; height: clamp(220px, 42vw, 480px); overflow: hidden; background: #FFF000\">\n      <img src=\"036b3c19-002b-41a5-9d9e-41cc11526dcd\" alt=\"Cajera de Lidl sonriendo mientras escanea un melón en la línea de caja\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\">\n    <\u002Fdiv>\n    <div style=\"background: #0050AA; color: #fff\">\n      <div style=\"max-width: min(1040px, max(64%, 330px)); margin: 0 auto; padding: clamp(40px, 7vw, 62px) 0 clamp(38px, 6vw, 58px)\">\n        <h1 style=\"margin: 0 0 30px; font-size: clamp(25px, 6vw, 33px); line-height: 1.2; font-weight: 800; letter-spacing: -.3px\">Nuestra razón de ser. Lo que nos mueve.<\u002Fh1>\n        <p style=\"margin: 0 0 22px; font-size: 17px; line-height: 1.55; font-weight: 400; text-wrap: pretty\">Lidl es sinónimo de calidad y fiabilidad. Situamos a nuestros clientes en el centro de todo lo que hacemos, ofreciendo un valor real mediante marcas propias con una excelente relación calidad-precio que facilitan una vida mejor y más asequible para todos.<\u002Fp>\n        <p style=\"margin: 0 0 22px; font-size: 17px; line-height: 1.55; font-weight: 400; text-wrap: pretty\">Al mismo tiempo, nos esforzamos por transformar lo complejo en soluciones sencillas para hacer la vida más fácil y cómoda a quienes nos eligen cada día. Además, continuamos avanzando hacia un modelo de negocio cada vez más responsable. Lo demostramos con hechos concretos, como nuestro plan de reducción de emisiones de CO₂ y un incremento de la reciclabilidad de materias primas medible y trazable.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.55; font-weight: 400; text-wrap: pretty\">La base de nuestro éxito son las alianzas: a lo largo de toda la cadena de valor, fomentamos una cultura basada en relaciones justas y de confianza, regidas por nuestro Código de Conducta para socios comerciales.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-bottom: 1px solid #E3E8EF; background: #F5F7FA; position: sticky; top: {{ anchorBarTop }}; z-index: 55\">\n    <div class=\"noscroll\" style=\"max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: safe center; gap: 10px; overflow-x: auto\">\n      <sc-for list=\"{{ anchors }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <a href=\"{{ a.href }}\" style=\"padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 400; white-space: nowrap; background: {{ a.bg }}; color: {{ a.color }}; transition: background .2s ease, color .2s ease\" style-hover=\"background: #DFE3E8; color: #0050AA\">{{ a.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"mision\" style=\"max-width: 1280px; margin: 0 auto; padding: clamp(44px, 7.5vw, 80px) 24px clamp(48px, 8vw, 90px)\">\n    <div style=\"max-width: min(1140px, 92%); margin: 0 auto clamp(34px, 5vw, 56px)\">\n      <p style=\"margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #5A7391; letter-spacing: .3px\">El cliente en el centro<\u002Fp>\n      <h2 style=\"margin: 0 0 18px; font-size: clamp(25px, 5vw, 34px); font-weight: 800; line-height: 1.15\">Lidl vale la pena<\u002Fh2>\n      <p style=\"margin: 0; font-size: 17px; line-height: 1.62; color: #002466; text-wrap: pretty\">En Lidl trabajamos día a día para ofrecer la mejor experiencia de compra. Combinamos la máxima calidad con un surtido coherente en precio y origen para que elegir Lidl valga la pena. Nos guiamos por cuatro promesas clave:<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"max-width: min(1140px, 92%); margin: 0 auto; display: grid; grid-template-columns: {{ tileColumns }}; gap: clamp(30px, 4vw, 48px)\">\n      <article style=\"display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"overflow: hidden; border-radius: 15px; background: #EDF1F6\">\n          <img src=\"bd289fb9-8d88-41f5-b286-73343169435d\" alt=\"Clienta sonriente eligiendo producto en una tienda Lidl\" style=\"width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; transition: transform .6s ease\" style-hover=\"transform: scale(1.05)\">\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 10px; font-size: clamp(18px, 2vw, 21px); font-weight: 800; line-height: 1.25\">Ser la primera opción<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15.5px; line-height: 1.62; color: #002466; text-wrap: pretty\">Queremos ser la primera opción para nuestros clientes, nuestro equipo y la sociedad en general, impulsando un modelo de negocio cada vez más responsable.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"overflow: hidden; border-radius: 15px; background: #EDF1F6\">\n          <img src=\"a3b97c33-2606-426f-b0cb-faf06f064e93\" alt=\"Frutas y verduras frescas en la sección de frescos de Lidl\" style=\"width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; transition: transform .6s ease\" style-hover=\"transform: scale(1.05)\">\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 10px; font-size: clamp(18px, 2vw, 21px); font-weight: 800; line-height: 1.25\">Máxima calidad al mejor precio<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15.5px; line-height: 1.62; color: #002466; text-wrap: pretty\">Gracias a nuestros procesos eficientes y alianzas sólidas, garantizamos una excelente relación calidad-precio para ofrecer la frescura y la máxima calidad Lidl cada día.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"overflow: hidden; border-radius: 15px; background: #EDF1F6\">\n          <img src=\"de5bc4a9-aec7-4f65-bd87-48373b283ce1\" alt=\"Detalle de un envase sostenible de marca propia de Lidl\" style=\"width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; transition: transform .6s ease\" style-hover=\"transform: scale(1.05)\">\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 10px; font-size: clamp(18px, 2vw, 21px); font-weight: 800; line-height: 1.25\">Sostenibilidad en acción<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15.5px; line-height: 1.62; color: #002466; text-wrap: pretty\">Asumimos nuestra responsabilidad con el entorno y la sociedad en cada decisión diaria, integrando firmemente este compromiso en nuestra cultura corporativa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"overflow: hidden; border-radius: 15px; background: #EDF1F6\">\n          <img src=\"3e6d55f7-aea4-4a3c-8417-1af42922f8f3\" alt=\"Persona usando la aplicación de Lidl en el móvil mientras compra\" style=\"width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; transition: transform .6s ease\" style-hover=\"transform: scale(1.05)\">\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 10px; font-size: clamp(18px, 2vw, 21px); font-weight: 800; line-height: 1.25\">Experiencia omnicanal<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15.5px; line-height: 1.62; color: #002466; text-wrap: pretty\">Ofrecemos una experiencia de compra única e integrada que va más allá de nuestras tiendas físicas, con el objetivo de ser el mejor aliado de nuestros clientes en su día a día.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: #0050AA; color: #fff\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(36px, 6vw, 56px) 24px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 40px\">\n      <div>\n        <h3 style=\"margin: 0 0 16px; font-size: 15px; font-weight: 800\">Compañía<\u002Fh3>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Trabajar en Lidl<\u002Fa>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Grupo Schwarz<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin: 0 0 16px; font-size: 15px; font-weight: 800\">Información legal<\u002Fh3>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Aviso legal<\u002Fa>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Política de cookies<\u002Fa>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Compliance | Canal de denuncias<\u002Fa>\n        <a href=\"#\" style=\"display: block; color: #fff; font-size: 14.5px; padding: 5px 0; opacity: .9\" style-hover=\"color: #FFF000; opacity: 1\">Política de privacidad<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin: 0 0 16px; font-size: 15px; font-weight: 800\">Redes sociales<\u002Fh3>\n        <a href=\"#\" aria-label=\"LinkedIn\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 2px solid rgba(255,255,255,.6); color: #fff\" style-hover=\"border: 2px solid #FFF000; color: #FFF000\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4.98 3.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 9h4v12H3zM10 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.4 4.78 5.5V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21h-4z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 1px solid rgba(255,255,255,.22)\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; font-size: 13px; opacity: .8\">\n        <span>© 2026 Lidl Supermercados S.A.U.<\u002Fspan>\n        <span style=\"font-size: 12px; line-height: 1.5; max-width: 760px\">Recreación no oficial realizada con fines educativos y de portafolio.<br>Sin afiliación con Lidl. «Lidl» y su logotipo son marcas registradas de Lidl Stiftung &amp; Co. KG.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <a href=\"#top\" style=\"position: fixed; right: clamp(14px, 3vw, 26px); bottom: clamp(14px, 3vw, 26px); z-index: 80; display: inline-flex; align-items: center; gap: 10px; background: #0050AA; color: #fff; font-size: 15px; font-weight: 700; padding: 13px 22px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,50,120,.3); transition: background .2s ease\" style-hover=\"background: #002466; color: #fff\">\n    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"M5 15l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n    Arriba\n  <\u002Fa>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;tileLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dos columnas&quot;,&quot;cuatro columnas&quot;],&quot;default&quot;:&quot;dos columnas&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Nuestra misión&quot;}}\">\nconst ICONS = {\n  home: [\"M3 11l9-7 9 7\", \"M5.5 9.6V20h13V9.6\"],\n};\n\nclass Component extends DCLogic {\n  state = {\n    isMobile: typeof window !== \"undefined\" ? window.matchMedia(\"(max-width: 1000px)\").matches : false,\n    menuOpen: false, drop: null, mobileGroup: null, activeAnchor: null\n  };\n\n  icon(key, size) {\n    const paths = ICONS[key] || [];\n    return React.createElement(\n      \"svg\",\n      { width: size, height: size, viewBox: \"0 0 24 24\", fill: \"none\", stroke: \"currentColor\", strokeWidth: 1.7, strokeLinecap: \"round\", strokeLinejoin: \"round\" },\n      paths.map((d, i) => React.createElement(\"path\", { key: i, d }))\n    );\n  }\n\n  submenu(key) {\n    const data = {\n      resp: [\n        [\"Vista general\", \"#\", \"home\"], [\"Proteger el clima\", \"#\", null],\n        [\"Respetar la biodiversidad\", \"#\", null], [\"Actuar con equidad\", \"#\", null],\n        [\"Gobierno corporativo\", \"#\", null], [\"Conservar los recursos\", \"#\", null],\n        [\"Fomentar la salud\", \"#\", null]\n      ],\n      press: [\n        [\"Vista general\", \"#\", \"home\"], [\"Notas de prensa\", \"#\", null],\n        [\"Lidl Stories\", \"#\", null], [\"Cifras y datos\", \"#\", null],\n        [\"Material gráfico\", \"#\", null], [\"Contacto de prensa\", \"#\", null],\n        [\"Suscripción a novedades\", \"#\", null]\n      ]\n    };\n    return (data[key] || []).map(([label, href, icon]) => ({\n      label, href, icon: icon ? this.icon(icon, 19) : null\n    }));\n  }\n\n  componentDidMount() {\n    this._spy = () => {\n      const ids = [\"mision\", \"alimentacion\", \"bazar\", \"digitalizacion\", \"logistica\"];\n      let active = null;\n      ids.forEach(id => {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= 140) active = id;\n      });\n      if (active !== this.state.activeAnchor) this.setState({ activeAnchor: active });\n    };\n    window.addEventListener(\"scroll\", this._spy, { passive: true });\n    this._spy();\n\n    this._mq = window.matchMedia(\"(max-width: 1000px)\");\n    this._onMq = (e) => this.setState({ isMobile: e.matches, menuOpen: false });\n    this._mq.addEventListener(\"change\", this._onMq);\n  }\n\n  componentWillUnmount() {\n    if (this._spy) window.removeEventListener(\"scroll\", this._spy);\n    if (this._mq && this._onMq) this._mq.removeEventListener(\"change\", this._onMq);\n  }\n\n  renderVals() {\n    const menuOpen = this.state.menuOpen;\n    const anchors = [\n      [\"mision\", \"Nuestra misión\"], [\"alimentacion\", \"Alimentación\"], [\"bazar\", \"Bazar\"],\n      [\"digitalizacion\", \"Digitalización\"], [\"logistica\", \"Logística\"]\n    ].map(([id, label]) => ({\n      href: \"#\" + id,\n      label,\n      bg: this.state.activeAnchor === id ? \"#0050AA\" : \"transparent\",\n      color: this.state.activeAnchor === id ? \"#ffffff\" : \"#5A7391\"\n    }));\n\n\n    const layout = this.props.tileLayout || \"dos columnas\";\n    return {\n      isMobile: !!this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      anchorBarTop: this.state.isMobile ? \"74px\" : \"0px\",\n      dropOpen: !!this.state.drop,\n      dropItems: this.submenu(this.state.drop),\n      respBg: this.state.drop === \"resp\" ? \"#EDF2F8\" : \"transparent\",\n      pressBg: this.state.drop === \"press\" ? \"#EDF2F8\" : \"transparent\",\n      openResp: () => this.setState({ drop: \"resp\" }),\n      openPress: () => this.setState({ drop: \"press\" }),\n      closeDrop: () => this.setState({ drop: null }),\n      mobileGroups: [\n        { key: \"resp\", title: \"Nuestra responsabilidad\" },\n        { key: \"press\", title: \"Sala de prensa\" }\n      ].map(g => ({\n        title: g.title,\n        open: this.state.mobileGroup === g.key,\n        chevron: this.state.mobileGroup === g.key ? \"rotate(180deg)\" : \"rotate(0deg)\",\n        items: this.submenu(g.key),\n        toggle: () => this.setState(s => ({ mobileGroup: s.mobileGroup === g.key ? null : g.key }))\n      })),\n      menuOpen,\n      burgerTop: menuOpen ? \"translateY(8px) rotate(45deg)\" : \"none\",\n      burgerMid: menuOpen ? 0 : 1,\n      burgerBot: menuOpen ? \"translateY(-8px) rotate(-45deg)\" : \"none\",\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      anchors,\n      tileColumns: layout === \"cuatro columnas\"\n        ? \"repeat(auto-fit, minmax(min(100%, 230px), 1fr))\"\n        : \"repeat(auto-fit, minmax(min(100%, 440px), 1fr))\"\n    };\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
